name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Pinned to the exact toolchain version the contract's
      # `pragma language_version` targets, rather than "latest" - the
      # Compact compiler's language version doesn't track its own release
      # version 1:1 (0.34.0 expects language_version 0.26.0, not 0.34.0),
      # so blindly updating breaks compilation until the contract's pragma
      # is bumped to match. Update this alongside contract/src/*.compact.
      - name: Install Compact toolchain (pinned)
        run: compact update 0.31.1

      # Known npm/arborist bug on a fresh install (no lockfile-free CI cache
      # hit) around optional peer deps - see README "Setup". Also pinned via
      # the root .npmrc, so this flag is now belt-and-suspenders.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Compile contract
        run: npm run compact --workspace=contract

      - name: Build contract package
        run: npm run build --workspace=contract

      - name: Test contract (vitest, local simulator)
        run: npm run test --workspace=contract

      - name: Typecheck contract
        run: npm run typecheck --workspace=contract

      - name: Typecheck frontend
        run: npm run typecheck --workspace=frontend

      - name: Build frontend
        run: npm run build --workspace=frontend

      - name: Typecheck cli
        run: npm run typecheck --workspace=cli
